    "/api/v1/rides/offline-sync": {
      "post": {
        "operationId": "rideOperationsPostOfflineSync",
        "summary": "Replay actions queued while offline",
        "description": "Replays up to 50 queued actions. A MANUAL_* action is always replayed as a forced one, since the guards it would hit describe the present rather than the moment the driver acted.",
        "tags": [
          "Ride Operations"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "actions"
                ],
                "properties": {
                  "actions": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 50,
                    "items": {
                      "type": "object",
                      "required": [
                        "actionId",
                        "eventType",
                        "rideId",
                        "clientTimestamp"
                      ],
                      "properties": {
                        "actionId": {
                          "type": "string",
                          "format": "uuid",
                          "description": "Client-generated id; replaying it is a no-op."
                        },
                        "lat": {
                          "type": "number",
                          "minimum": -90,
                          "maximum": 90
                        },
                        "lng": {
                          "type": "number",
                          "minimum": -180,
                          "maximum": 180
                        },
                        "clientTimestamp": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "force": {
                          "type": "boolean",
                          "default": false,
                          "description": "Push the step through even though a guard refuses it. Only accepted while the ride is IN_PROGRESS; otherwise the call fails with 409 FORCE_REQUIRES_RIDE_IN_PROGRESS. Every forced step is audited, shown to the rider and queued for admin review."
                        },
                        "overrideReason": {
                          "type": "string",
                          "minLength": 5,
                          "maxLength": 500,
                          "description": "Why the step had to be forced. Required whenever force is true."
                        },
                        "eventType": {
                          "type": "string"
                        },
                        "rideId": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "bookingId": {
                          "type": "string",
                          "format": "uuid"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "404": {
            "$ref": "../components/responses/errors.yaml#/NotFound"
          },
          "409": {
            "$ref": "../components/responses/errors.yaml#/Conflict"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
