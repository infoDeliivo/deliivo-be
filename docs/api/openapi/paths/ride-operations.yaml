{
  "paths": {
    "/api/v1/rides/{rideId}/start": {
      "post": {
        "operationId": "rideOperationsPostByRideIdStart",
        "summary": "Start a ride",
        "description": "Moves the ride to IN_PROGRESS. Not forceable: a ride that has not started cannot be overridden, so the departure window and the state transition always apply.",
        "tags": [
          "Ride Operations"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/parameters/common.yaml#/RideIdPath"
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "actionId": {
                    "type": "string",
                    "format": "uuid",
                    "description": "Client-generated id; replaying it is a no-op."
                  },
                  "lat": {
                    "type": "number",
                    "minimum": -90,
                    "maximum": 90
                  },
                  "lng": {
                    "type": "number",
                    "minimum": -180,
                    "maximum": 180
                  },
                  "clientTimestamp": {
                    "type": "string",
                    "format": "date-time"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "404": {
            "$ref": "../components/responses/errors.yaml#/NotFound"
          },
          "409": {
            "$ref": "../components/responses/errors.yaml#/Conflict"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
    "/api/v1/rides/{rideId}/finish": {
      "post": {
        "operationId": "rideOperationsPostByRideIdFinish",
        "summary": "Finish a ride",
        "description": "Completes the ride. Forcing skips BOOKINGS_NOT_ALL_TERMINAL; the bookings left open are named in the audit event and each of their riders is warned.",
        "tags": [
          "Ride Operations"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/parameters/common.yaml#/RideIdPath"
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "actionId": {
                    "type": "string",
                    "format": "uuid",
                    "description": "Client-generated id; replaying it is a no-op."
                  },
                  "lat": {
                    "type": "number",
                    "minimum": -90,
                    "maximum": 90
                  },
                  "lng": {
                    "type": "number",
                    "minimum": -180,
                    "maximum": 180
                  },
                  "clientTimestamp": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "force": {
                    "type": "boolean",
                    "default": false,
                    "description": "Push the step through even though a guard refuses it. Only accepted while the ride is IN_PROGRESS; otherwise the call fails with 409 FORCE_REQUIRES_RIDE_IN_PROGRESS. Every forced step is audited, shown to the rider and queued for admin review."
                  },
                  "overrideReason": {
                    "type": "string",
                    "minLength": 5,
                    "maxLength": 500,
                    "description": "Why the step had to be forced. Required whenever force is true."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "data": {
                          "type": "object",
                          "properties": {
                            "forced": {
                              "type": "boolean",
                              "description": "True when this step was pushed through by an override."
                            },
                            "overrideReason": {
                              "type": [
                                "string",
                                "null"
                              ]
                            },
                            "skippedChecks": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              },
                              "description": "Guard codes the override skipped, e.g. WAIT_TIME_NOT_ELAPSED."
                            }
                          }
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "404": {
            "$ref": "../components/responses/errors.yaml#/NotFound"
          },
          "409": {
            "description": "A guard refused the step, or the step was forced while the ride was not in progress (FORCE_REQUIRES_RIDE_IN_PROGRESS).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
