        "operationId": "rideOperationsPostByIdVerifyPickupOtp",
        "summary": "Verify the pickup OTP and board the passenger",
        "description": "Forcing skips a missing, expired, wrong or attempt-exhausted OTP, does not burn an OTP attempt, and opens a NEEDS_MANUAL_REVIEW dispute. otp may be omitted only when force is true.",
