                "type": "object",
                "properties": {
                  "actionId": {
                    "type": "string",
                    "format": "uuid",
                    "description": "Client-generated id; replaying it is a no-op."
                  },
                  "lat": {
                    "type": "number",
                    "minimum": -90,
                    "maximum": 90
                  },
                  "lng": {
                    "type": "number",
                    "minimum": -180,
                    "maximum": 180
                  },
                  "clientTimestamp": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "force": {
                    "type": "boolean",
                    "default": false,
                    "description": "Push the step through even though a guard refuses it. Only accepted while the ride is IN_PROGRESS; otherwise the call fails with 409 FORCE_REQUIRES_RIDE_IN_PROGRESS. Every forced step is audited, shown to the rider and queued for admin review."
