paths:
  /api/v1/dl-verification:
    post:
      tags:
        - "DL Verification"
      summary: "Create a Veriff session for DL verification"
      operationId: createDlVerificationSession
      description: "Creates a new verification session via the Veriff API. Returns the session tracking ID and URL which are required by the frontend/SDK to complete the process."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
              properties:
                firstName:
                  type: string
                  example: "John"
                  description: "User's first name, exactly as displayed on their document."
                lastName:
                  type: string
                  example: "Doe"
                  description: "User's last name, exactly as displayed on their document."
      responses:
        '201':
          description: "Veriff session created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Veriff session created successfully"
                  data:
                    type: object
                    properties:
                      verificationId:
                        type: string
                        format: uuid
                        description: "Internal database ID tracking the verification session."
                      sessionId:
                        type: string
                        format: uuid
                        description: "Veriff API Session ID"
                      sessionUrl:
                        type: string
                        format: uri
                        description: "The verification URL to load in the Web flow or pass to the Mobile SDKs."
        '409':
          description: "User is already verified"
        '500':
          description: "Internal Server Error or Veriff API Error"

  /api/v1/dl-verification/status:
    get:
      tags:
        - "DL Verification"
      summary: "Get current DL verification status"
      operationId: getDlVerificationStatus
      description: "Returns the latest driving license verification attempt for the authenticated user and its outcome."
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Verification status retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "DL verification status retrieved"
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [PENDING, APPROVED, DECLINED, RESUBMISSION_REQUESTED, EXPIRED, NOT_STARTED]
                      verificationId:
                        type: string
                        format: uuid
                      sessionId:
                        type: string
                        format: uuid
                      sessionUrl:
                        type: string
                        format: uri
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time

  /api/v1/dl-verification/webhook:
    post:
      tags:
        - "DL Verification"
      summary: "Veriff decision webhook"
      operationId: handleDlVerificationWebhook
      description: "Public endpoint where Veriff sends session decision updates. Validated securely using HMAC-SHA256."
      security: []
      parameters:
        - in: header
          name: x-hmac-signature
          required: true
          schema:
            type: string
          description: "Hex encoded HMAC-SHA256 signature computed over the raw request payload using the Veriff Shared Secret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verification:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: "The Veriff session ID"
                    status:
                      type: string
                      description: "The decision result (approved, declined, resubmission_requested, expired)"
                    code:
                      type: integer
                      description: "Decision code corresponding to the status"
                    reasonCode:
                      type: integer
                      description: "Decline reason code (e.g. poor image quality, expired document)"
      responses:
        '200':
          description: "Webhook processed, successfully updated DB or ignored deliberately. Veriff expects 200 OK."
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "APPROVED"
        '401':
          description: "HMAC validation failed or header missing"

  /api/v1/dl-verification/events:
    post:
      tags:
        - "DL Verification"
      summary: "Veriff event webhook"
      operationId: handleDlVerificationEvent
      description: >
        Public endpoint for Veriff's event stream, which is separate from the decision
        webhook: it reports progress through the flow and carries no verdict. Its payload is
        flat rather than nested under `verification`. Only `action: "submitted"` is acted on,
        recording that the driver actually uploaded their documents — the verification row is
        created when the session opens, so it cannot otherwise distinguish a driver waiting on
        a decision from one who abandoned the flow. Authenticated with the same HMAC-SHA256
        shared secret as the decision webhook. Always answers 200 so Veriff does not retry.
      security: []
      parameters:
        - in: header
          name: x-hmac-signature
          required: true
          schema:
            type: string
          description: "Hex encoded HMAC-SHA256 signature computed over the raw request payload using the Veriff Shared Secret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: "The Veriff session ID"
                attemptId:
                  type: string
                  format: uuid
                  description: "The verification attempt within the session"
                action:
                  type: string
                  description: "Stage the driver reached (started, submitted). Only `submitted` is recorded."
                  example: "submitted"
                code:
                  type: integer
                  description: "Event code corresponding to the action (7001 started, 7002 submitted)"
                  example: 7002
                feature:
                  type: string
                  example: "selfid"
      responses:
        '200':
          description: >
            Event acknowledged. `warning` names why nothing was recorded: `IGNORED_ACTION` for
            an action other than submitted, `NO_MATCHING_SESSION` when no row holds that
            session id, `INVALID_PAYLOAD` for a signed body that is not JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  warning:
                    type: string
                    example: "IGNORED_ACTION"
        '401':
          description: "HMAC validation failed or header missing"

  /api/v1/dl-verification/document:
    post:
      tags:
        - "DL Verification"
      summary: "Submit a driving licence photo for manual review"
      operationId: submitDlDocument
      description: >
        Manual-review fallback for a driver who does not complete the Veriff flow. The
        licence photo is uploaded first through the private `vehicle_draft_document_private`
        target; this endpoint attaches the resulting object key so an admin can read it in
        the review queue. Re-submitting after a decline clears the previous reason and
        returns the driver to the queue. Refused with 409 when the driver is already
        verified, by Veriff or by an earlier manual approval.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentImageKey
              properties:
                documentImageKey:
                  type: string
                  maxLength: 500
                  example: "uploads/vehicle-documents/1f0c.../licence.jpg"
                  description: >
                    Private S3 object key for the licence photo. Must begin with
                    `uploads/vehicle-documents/` — a public key is rejected, since a KYC
                    document must never be world-readable.
      responses:
        '201':
          description: "Driving licence submitted for review"
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ApiSuccessEnvelope"
        '400':
          $ref: "../components/responses/errors.yaml#/BadRequest"
        '401':
          $ref: "../components/responses/errors.yaml#/Unauthorized"
        '404':
          $ref: "../components/responses/errors.yaml#/NotFound"
        '409':
          description: "The driving licence is already verified"
        '500':
          $ref: "../components/responses/errors.yaml#/ServerError"
