        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "accepted"
                ],
                "properties": {
                  "accepted": {
                    "type": "boolean",
                    "enum": [
                      true
                    ],
                    "example": true
                  }
                }
              }
            }
          }
        },
