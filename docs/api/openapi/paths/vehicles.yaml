    "/api/v1/vehicles/draft/upload-document": {
      "post": {
        "operationId": "vehiclesPostDraftUploadDocument",
        "summary": "POST vehicles/draft/upload-document",
        "tags": [
          "Vehicles"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                },
                "examples": {
                  "default": {
                    "$ref": "../components/examples/common.yaml#/VehicleDraftSuccess"
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "404": {
            "$ref": "../components/responses/errors.yaml#/NotFound"
          },
          "409": {
            "$ref": "../components/responses/errors.yaml#/Conflict"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "description": "Attach an uploaded document to the draft. Provide exactly one of imageUrl (public docs, e.g. VEHICLE_IMAGE) or imageKey (private KYC docs, e.g. DRIVING_LICENSE / INSURANCE_DOCUMENT).",
                "required": [
                  "documentType"
                ],
                "properties": {
                  "imageUrl": {
                    "type": "string",
                    "format": "uri",
                    "description": "Public URL returned by POST /uploads/confirm (target=vehicle_draft_document). For public docs only."
                  },
                  "imageKey": {
                    "type": "string",
                    "description": "Private object key returned by POST /uploads/confirm (target=vehicle_draft_document_private). For private KYC docs; becomes the document's previewKey."
                  },
                  "documentType": {
                    "type": "string",
                    "enum": [
                      "VEHICLE_IMAGE",
                      "VEHICLE_DOCUMENT",
                      "DRIVING_LICENSE",
                      "INSURANCE_DOCUMENT"
                    ]
                  }
                }
              }
            }
          }
        }
      }
    },
