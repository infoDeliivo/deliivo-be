    "/api/v1/admin/ride-overrides": {
      "get": {
        "operationId": "adminGetRideOverrides",
        "summary": "List forced ride actions awaiting review",
        "description": "Every step a driver forced through, newest first: the reason they typed and the guards their override skipped are in the event metadata.",
        "tags": [
          "Admin"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "1-based page number.",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Page size, max 100.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "actorId",
            "in": "query",
            "required": false,
            "description": "Only overrides by this user.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "rideId",
            "in": "query",
            "required": false,
            "description": "Only overrides on this ride.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "bookingId",
            "in": "query",
            "required": false,
            "description": "Only overrides on this booking.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "description": "Earliest server timestamp.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "description": "Latest server timestamp.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
    "/api/v1/admin/users": {
      "get": {
        "operationId": "adminListUsers",
        "summary": "GET admin/users",
        "description": "Paginated user list for admins, newest first, with status, country and driving-licence filters.",
        "tags": [
          "Admin"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "search",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "description": "Case-insensitive match on first name, last name, email or phone."
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "description": "`active` = not archived and not banned; `banned` = banned and not archived; `archived` = archived; `all` = everyone. Omitted, archived users are hidden and the legacy `isBanned` filter applies.",
            "schema": {
              "type": "string",
              "enum": [
                "active",
                "banned",
                "archived",
                "all"
              ]
            }
          },
          {
            "name": "isBanned",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "true",
                "false"
              ]
            },
            "description": "Legacy; prefer `status`."
          },
          {
            "name": "role",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "USER",
                "ADMIN"
              ]
            }
          },
          {
            "name": "dlVerified",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "true",
                "false"
              ]
            }
          },
          {
            "name": "country",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z]{2}$"
            },
            "description": "ISO 3166-1 alpha-2 code, matched against the country part of the IP-detected `detectedCountry`. Users with no detected country never match."
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
