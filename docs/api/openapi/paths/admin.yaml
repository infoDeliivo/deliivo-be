{
  "paths": {
    "/api/v1/admin/vehicles": {
      "get": {
        "operationId": "adminGetVehicles",
        "summary": "GET admin/vehicles",
        "description": "Vehicle review queue, oldest first. Private documents (the vehicle registry) are returned as `previewKey` only — exchange the key for a short-lived signed URL via `GET /api/v1/uploads/read`, which admins may call for any owner's key.",
        "tags": [
          "Admin"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "required": false,
            "description": "Filter by review state. Omit to return every status.",
            "schema": {
              "type": "string",
              "enum": [
                "PENDING",
                "APPROVED",
                "REJECTED"
              ]
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
    "/api/v1/admin/vehicles/{id}/verify": {
      "post": {
        "operationId": "adminVerifyVehicle",
        "summary": "POST admin/vehicles/{id}/verify",
        "description": "Approve a vehicle. Sets `verificationStatus` to APPROVED, keeps `isVerified` in sync, and notifies the driver that they can now publish rides.",
        "tags": [
          "Admin"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "404": {
            "$ref": "../components/responses/errors.yaml#/NotFound"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    },
    "/api/v1/admin/vehicles/{id}/reject": {
      "post": {
        "operationId": "adminRejectVehicle",
        "summary": "POST admin/vehicles/{id}/reject",
        "description": "Reject a vehicle. Sets `verificationStatus` to REJECTED, stores the reason, and sends it to the driver verbatim so they know what to re-upload.",
        "tags": [
          "Admin"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "reason"
                ],
                "properties": {
                  "reason": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 500,
                    "description": "Shown to the driver verbatim."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../components/schemas/common.yaml#/ApiSuccessEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/responses/errors.yaml#/BadRequest"
          },
          "401": {
            "$ref": "../components/responses/errors.yaml#/Unauthorized"
          },
          "403": {
            "$ref": "../components/responses/errors.yaml#/Forbidden"
          },
          "404": {
            "$ref": "../components/responses/errors.yaml#/NotFound"
          },
          "500": {
            "$ref": "../components/responses/errors.yaml#/ServerError"
          }
        }
      }
    }
  }
}
